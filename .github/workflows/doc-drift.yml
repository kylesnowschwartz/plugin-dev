# yamllint disable rule:line-length
name: Doc Drift

# Compares the shipped plugin-dev docs against ground truth read from the Claude
# Code CLI this job installs, so a pull request is judged against the release
# users are on rather than against the checked-in facts file.

on:
  pull_request:
    paths:
      - "plugins/plugin-dev/**"
      - "docs/claude-code-facts.json"
      - "scripts/**"
      # Check J sweeps the whole .github tree for denylisted names, and check E
      # reads .github/workflows/component-validation.yml.
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Check Doc Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check required tools
        run: |
          set -euo pipefail
          for t in jq python3 strings; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done

      - name: Install the Claude Code CLI the facts file names
        run: |
          set -euo pipefail
          # The gate asks one question: do the docs agree with the release they
          # claim to describe? That release is the one recorded in the facts
          # file. Installing `latest` instead would fail every pull request the
          # moment upstream ships, until the sync pipeline catches up; finding
          # new releases is the sync's job, not a pull request author's.
          target=$(jq -r '.claude_code_version // empty' docs/claude-code-facts.json)
          if [ -z "$target" ]; then
            echo "docs/claude-code-facts.json has no claude_code_version; installing latest"
            target=latest
          fi
          echo "PINNED_CLAUDE_VERSION=$target" >> "$GITHUB_ENV"

          install_cli() {
            for attempt in 1 2 3; do
              if curl -fsSL https://claude.ai/install.sh | bash -s -- "$1"; then
                return 0
              fi
              echo "Install of $1, attempt $attempt failed; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            return 1
          }

          if ! install_cli "$target"; then
            if [ "$target" = latest ]; then
              echo "Claude Code install failed after 3 attempts"
              exit 1
            fi
            echo "Version $target is not downloadable; installing latest instead"
            install_cli latest || { echo "Claude Code install failed after 3 attempts"; exit 1; }
          fi

          executable="$HOME/.local/bin/claude"
          [ -x "$executable" ] || {
            echo "Claude Code CLI not found at $executable"
            exit 1
          }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CLAUDE_CODE_EXECUTABLE=$executable" >> "$GITHUB_ENV"

          version=$("$executable" --version)
          {
            echo "## Claude Code CLI"
            echo "Facts file names: $target"
            echo "Installed: $version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check doc drift
        env:
          CLAUDE_CODE_EXECUTABLE: ${{ env.CLAUDE_CODE_EXECUTABLE }}
        run: |
          set -uo pipefail
          # Ground truth comes from the installed binary, not from the checked-in
          # facts file, so a pull request cannot pass by editing both sides.
          set +e
          scripts/extract-cc-facts.sh \
            --binary "$CLAUDE_CODE_EXECUTABLE" \
            --out /tmp/facts.json
          extract_status=$?
          set -e
          if [ "$extract_status" -ne 0 ]; then
            echo "extract-cc-facts.sh failed with exit $extract_status"
            exit 1
          fi

          set +e
          scripts/check-doc-drift.sh --facts /tmp/facts.json > drift-report.txt 2>drift-errors.txt
          status=$?
          set -e

          {
            echo "## Doc Drift"
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat drift-report.txt
          cat drift-errors.txt >&2

          if [ "$status" -eq 2 ]; then
            echo "check-doc-drift.sh reported a tooling error; see the ERROR lines above."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Documentation disagrees with the facts read from the installed Claude Code CLI."
            exit 1
          fi
          echo "No drift found."

      - name: Compare the extracted facts with the committed file
        if: always()
        env:
          PINNED_CLAUDE_VERSION: ${{ env.PINNED_CLAUDE_VERSION }}
        run: |
          set -euo pipefail
          [ -f /tmp/facts.json ] || exit 0
          installed=$(jq -r '.claude_code_version' /tmp/facts.json)
          if [ "$installed" != "$PINNED_CLAUDE_VERSION" ]; then
            # The pinned release was not downloadable and `latest` stood in, so
            # differences are upstream changes for the sync to pick up.
            echo "Installed $installed instead of $PINNED_CLAUDE_VERSION; facts comparison skipped."
            exit 0
          fi
          if git diff --no-index --quiet docs/claude-code-facts.json /tmp/facts.json; then
            exit 0
          fi
          # Same release, different facts: the extractor changed and the file
          # was not regenerated, or the file was hand-edited.
          {
            echo "## Facts file"
            echo "docs/claude-code-facts.json differs from a fresh extract of the same release."
            echo "Regenerate it: scripts/extract-cc-facts.sh --out docs/claude-code-facts.json"
            echo '```'
            git diff --no-index docs/claude-code-facts.json /tmp/facts.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "docs/claude-code-facts.json differs from a fresh extract of the same release; regenerate it."
          exit 1
