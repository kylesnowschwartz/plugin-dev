name: Doc Drift

# Compares the shipped plugin-dev docs against docs/claude-code-facts.json.
# Runs the deterministic half of the drift guard only, so no Claude Code CLI
# is needed: scripts/check-doc-drift.sh --skip-validate.

on:
  pull_request:
    paths:
      - "plugins/plugin-dev/**"
      - "docs/claude-code-facts.json"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Check Doc Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check doc drift
        run: |
          set -uo pipefail
          set +e
          scripts/check-doc-drift.sh --skip-validate > drift-report.txt 2>&1
          status=$?
          set -e

          {
            echo "## Doc Drift"
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat drift-report.txt

          if [ "$status" -eq 2 ]; then
            echo "check-doc-drift.sh reported a tooling error."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Documentation disagrees with docs/claude-code-facts.json."
            exit 1
          fi
          echo "No drift found."
